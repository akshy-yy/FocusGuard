<!DOCTYPE html>
<html>

<head>
    <title>FocusGuard Dashboard</title>
    <link rel="stylesheet" href="dashboard.css">
</head>

<body>

<div class="container">

<h1>FocusGuard</h1>

<div class="card">
    <input 
        id="website" 
        placeholder="website.com"
    />

    <input 
        type="number" 
        id="minutes" 
        placeholder="Block Duration"
    />

    <button id="addBtn">
        Add Website
    </button>
</div>

<div class="card">

<h2>Blocked Websites</h2>

<ul id="websiteList"></ul>

</div>

</div>

<div id="modalOverlay" class="modal-overlay hidden">
    <div class="modal-card">
        <h2>Block Website</h2>
        
        <p>How long do you want to block this website?</p>
        
        <input type="number" id="modalMinutes" placeholder="Enter time in minutes">
        
        <div class="modal-actions">
            <button id="cancelModal">
                Cancel
            </button>
           
            <button id="confirmModal">
                Confirm
            </button>
        </div>
    </div>
</div>
<script src="dashboard.js"></script>

</body>
</html>
